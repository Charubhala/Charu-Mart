<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Registration | Charu Mart</title>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .card {
            background: white;
            padding: 36px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            color: #0f172a;
            font-size: 26px;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 24px;
        }

        form {
            display: grid;
            gap: 16px;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #ffffff;
            color: #0f172a;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button[type="submit"] {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button[type="submit"]:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 12px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }

        .back-link:hover {
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">
        <h1>Seller Registration</h1>
        <p class="subtitle">
            Create your Charu Mart seller account
        </p>

        <form id="sellerForm">
            <input
                type="text"
                id="name"
                placeholder="Seller Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">
                Create Seller Account
            </button>
        </form>

        <p id="message"></p>

        <p class="login-link">
            Already have an account?
            <a href="seller-login.html">
                Seller Login
            </a>
        </p>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>
    </div>
</div>

<script>
document
    .getElementById("sellerForm")
    .addEventListener(
        "submit",
        async function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const message = document.getElementById("message");

            // Password check
            if (password !== confirmPassword) {
                message.style.color = "red";
                message.textContent = "Passwords do not match.";
                return;
            }

            try {
                const response = await fetch(
                    "http://localhost:5000/api/register",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            name: name,
                            email: email,
                            password: password,
                            role: "seller"
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    message.style.color = "red";
                    message.textContent = data.message || "Registration failed.";
                    return;
                }

                message.style.color = "green";
                message.textContent = "Seller account created successfully!";

                document.getElementById("sellerForm").reset();

                // Go to seller login
                setTimeout(function() {
                    window.location.href = "seller-login.html";
                }, 1500);

            } catch (error) {
                console.error(error);
                message.style.color = "red";
                message.textContent = "Server error. Please try again.";
            }
        }
    );
</script>

</body>
</html>
