<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charu Mart - Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h1>🛒 Charu Mart - Your Cart</h1>
        <nav>
            <a href="home.html">Home</a>
            <a href="orders.html">My Orders</a>
        </nav>
    </header>

    <main class="container" style="padding: 20px;">
        <h2>Shopping Cart</h2>
        <div id="cart-items-container">
            <p>Loading your cart...</p>
        </div>
        <div id="cart-summary" style="margin-top: 20px;">
            <a href="checkout.html" class="add-cart-btn" style="text-decoration: none; padding: 10px 20px; display: inline-block;">Proceed to Checkout ➔</a>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadCart();
        });
    </script>
</body>
</html>
