<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charu Mart - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h1>🛒 Charu Mart - Registration</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="container" style="padding: 20px; max-width: 400px; margin: auto;">
        <h2>Create an Account</h2>
        <form id="register-form" onsubmit="handleRegister(event)">
            <div style="margin-bottom: 15px;">
                <label>Username:</label><br>
                <input type="text" id="reg-username" required style="width: 100%; padding: 8px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Password:</label><br>
                <input type="password" id="reg-password" required style="width: 100%; padding: 8px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Role:</label><br>
                <select id="reg-role" style="width: 100%; padding: 8px;">
                    <option value="buyer">Buyer</option>
                    <option value="seller">Seller</option>
                </select>
            </div>
            <button type="submit" class="add-cart-btn" style="width: 100%; padding: 10px; cursor: pointer;">Register</button>
        </form>
        <p style="margin-top: 15px; text-align: center;">
            Already have an account? <a href="login.html">Login here</a>
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
