<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Charu Mart</title>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f9;
            color: #1e293b;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 36px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            margin-bottom: 6px;
            font-size: 22px;
            color: #0f172a;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            margin-bottom: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            color: #0f172a;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 10px;
            background: #0f172a;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        .back {
            margin-top: 20px;
            text-align: center;
        }

        .back a {
            color: #2563eb;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h1>Admin Login</h1>
    <p class="subtitle">
        Access Charu Mart marketplace administration
    </p>

    <form id="adminLoginForm">
        <input
            type="email"
            id="email"
            placeholder="Admin Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>
    </form>

    <div class="back">
        <a href="index.html">
            ← Back to Home
        </a>
    </div>
</div>

<script>
document.getElementById("adminLoginForm")
.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    try {
        const response = await fetch(
            "http://localhost:5000/api/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            alert(data.message || "Login failed.");
            return;
        }

        if (data.user.role !== "admin") {
            alert("This account is not an admin account.");
            return;
        }

        localStorage.setItem(
            "user",
            JSON.stringify(data.user)
        );

        window.location.href = "admin.html";

    } catch (error) {
        alert(
            "Cannot connect to server. Make sure backend is running."
        );
    }
});
</script>

</body>
</html>
